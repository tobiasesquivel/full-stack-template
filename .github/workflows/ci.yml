name: Template CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  BACKEND_SHARDS: 3
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend-build:
    name: Backend build de tests y reparto en shards
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            **/*.csproj
            dune/Dune.props
      - name: Build de los tests y del producto que prueban (los analyzers corren en backend-gates)
        run: dotnet build backend/Tests/TemplateApp.Tests.csproj --configuration Release -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
      - name: Lista de clases y de tests del ensamblado sin repartir (al listar, el código 8 es "ningún test corrió")
        run: |
          mkdir -p backend/Tests/bin/Release/listing
          for kind in classes full; do
            code=0
            dotnet backend/Tests/bin/Release/net10.0/TemplateApp.Tests.dll --xunit-list "$kind" > "backend/Tests/bin/Release/listing/$kind.txt" || code=$?
            if [ "$code" != 0 ] && [ "$code" != 8 ]; then
              cat "backend/Tests/bin/Release/listing/$kind.txt"
              echo "::error::--xunit-list $kind terminó con el código $code"
              exit 1
            fi
          done
          grep -c "Test method:" backend/Tests/bin/Release/listing/full.txt
      - name: Tiempos por clase de la última corrida completa de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/timings"
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" --name backend-test-timings --dir "$RUNNER_TEMP/timings"; then
            echo "Tiempos de la corrida de main $run"
          else
            echo "::notice::La última corrida de main no tiene backend-test-timings: el reparto usa .github/backend-test-timings.json"
            cp .github/backend-test-timings.json "$RUNNER_TEMP/timings/backend-test-timings.json"
          fi
      - name: Reparto en shards
        id: plan
        run: echo "shards=$(node .github/scripts/backend-test-shards.mjs plan --classes backend/Tests/bin/Release/listing/classes.txt --timings "$RUNNER_TEMP/timings/backend-test-timings.json" --shards ${{ env.BACKEND_SHARDS }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-tests-build
          path: backend/Tests/bin/Release/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: backend-tests-listing
          path: backend/Tests/bin/Release/listing/
          retention-days: 7
          if-no-files-found: error

  backend-shard:
    name: Backend tests shard ${{ matrix.index }}
    needs: backend-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.backend-build.outputs.shards) }}
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
    steps:
      - name: PostgreSQL propio y desechable
        run: docker run --detach --name postgres --publish 5432:5432 --env POSTGRES_PASSWORD=template-ci --env POSTGRES_DB=template_tests postgres:18
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@v4
        with:
          name: backend-tests-build
          path: backend/Tests/bin/Release
      - name: Esperar PostgreSQL
        run: until docker exec postgres pg_isready --username postgres --dbname template_tests; do sleep 1; done
      - name: Backend tests del shard ${{ matrix.index }} (${{ matrix.classes }} clases, ${{ matrix.seconds }} s estimados)
        run: dotnet backend/Tests/bin/Release/net10.0/TemplateApp.Tests.dll ${{ matrix.filter }} --report-xunit-xml --report-xunit-xml-filename shard-${{ matrix.index }}.xml --results-directory "$RUNNER_TEMP/results"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/results/
          retention-days: 7
          if-no-files-found: ignore

  backend-tests:
    name: Backend tests con PostgreSQL real
    needs: [backend-build, backend-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Todos los shards terminaron bien
        run: |
          echo "build: ${{ needs.backend-build.result }}, shards: ${{ needs.backend-shard.result }}"
          test "${{ needs.backend-build.result }}" = success
          test "${{ needs.backend-shard.result }}" = success
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: backend-tests-listing
          path: ${{ runner.temp }}/listing
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-tests-shard-*
          path: ${{ runner.temp }}/results
      - name: Cada test de la lista corrió una sola vez entre todos los shards
        run: node .github/scripts/backend-test-shards.mjs verify --listing "$RUNNER_TEMP/listing/full.txt" --results "$RUNNER_TEMP/results" --timings-out "$RUNNER_TEMP/backend-test-timings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-test-timings
          path: ${{ runner.temp }}/backend-test-timings.json
          retention-days: 90

  backend-gates:
    name: Backend build completo, codegen y analyzers Dune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            **/*.csproj
            dune/Dune.props
      - name: Backend build (analyzers como errores)
        run: dotnet build TemplateApp.slnx --configuration Release
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
      - name: Código generado de Wolverine al día (codegen write)
        run: node dune/check-codegen.mjs --release
      - name: Verificador de comentarios C#
        run: dotnet run --project dune/Dune.CommentVerifier -- --root .
      - name: Analyzer tests Dune
        run: dotnet test dune/Dune.Analyzers.Tests/Dune.Analyzers.Tests.csproj --configuration Release --no-build

  frontend:
    name: Frontend build y gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Formato del frontend (Prettier)
        run: npm run format:check
      - name: Tests de frontend (Vitest)
        run: npm test -- --watch=false

  node-gates:
    name: Gates de Node, runbooks y reglas de Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias de analisis
        run: npm ci --prefix frontend
      - name: Tests del gate de comentarios
        if: ${{ !cancelled() }}
        run: node --test dune/check-comments.test.mjs
      - name: Gate de comentarios
        if: ${{ !cancelled() }}
        run: node dune/check-comments.mjs --root .
      - name: Tests del gate de frontend
        if: ${{ !cancelled() }}
        run: node --test dune/check-frontend.test.mjs
      - name: Gate de frontend
        if: ${{ !cancelled() }}
        run: node dune/check-frontend.mjs --root .
      - name: Gate de estructura
        if: ${{ !cancelled() }}
        run: node dune/check-structure.mjs
      - name: Tests del gate de estructura
        if: ${{ !cancelled() }}
        run: node --test dune/check-structure.test.mjs
      - name: Tests del gate de codegen
        if: ${{ !cancelled() }}
        run: node --test dune/check-codegen.test.mjs
      - name: Tests del reparto de backend en shards
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/backend-test-shards.test.mjs
      - name: Tests del gate de runbooks
        if: ${{ !cancelled() }}
        run: node --test dune/check-runbooks.test.mjs
      - name: Toda alerta tiene su runbook
        if: ${{ !cancelled() }}
        run: node dune/check-runbooks.mjs
      - name: Imagen de Prometheus de compose.yaml
        if: ${{ !cancelled() }}
        run: echo "PROMETHEUS_IMAGE=$(grep -oE 'prom/prometheus:[^[:space:]]+' compose.yaml | head -n 1)" >> "$GITHUB_ENV"
      - name: Configuración y reglas de Prometheus (promtool, lint fatal)
        if: ${{ !cancelled() }}
        run: docker run --rm --entrypoint promtool --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" "$PROMETHEUS_IMAGE" check config --lint-fatal /etc/prometheus/prometheus.yml
      - name: Pruebas unitarias de las alertas (promtool)
        if: ${{ !cancelled() }}
        run: docker run --rm --entrypoint promtool --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" "$PROMETHEUS_IMAGE" test rules /etc/prometheus/rules/slo-api.test.yml

  security:
    name: Escaneo de secretos y dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
      - name: actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            **/*.csproj
            dune/Dune.props
      - name: Instalar gitleaks (versión y checksum fijos)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Secretos en el historial alcanzable desde HEAD
        run: node dune/check-secrets.mjs
      - name: Tests del gate de secretos
        run: node --test dune/check-secrets.test.mjs
      - name: Auditoría NuGet (alta y crítica fallan)
        run: dotnet restore TemplateApp.slnx "-warnaserror:NU1903;NU1904"
      - name: Auditoría npm de producción (alta y crítica fallan)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker config y smoke runtime
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      RABBITMQ_PASSWORD: ci-rabbitmq-password
      OTEL_EXPORT_DIR: ${{ github.workspace }}/otel-export
      ACCOUNT_CLOSURE_GRACE_SECONDS: 20
      ACCOUNT_CLOSURE_FIRST_REMINDER_SECONDS: 5
      ACCOUNT_CLOSURE_SECOND_REMINDER_SECONDS: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bajar en segundo plano las imágenes que compose no construye
        run: nohup sh -c 'docker compose config --images | grep -v "^full-stack-template-" | xargs -P 4 -n 1 docker pull --quiet' > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Tests del control del export OTEL
        run: node --test .agents/skills/verify-template/scripts/check-otel-export.test.mjs
      - name: Tests del veredicto del ensayo de migraciones
        run: node --test .agents/skills/verify-template/scripts/rehearsal-verdict.test.mjs
      - name: Preparar export OTEL
        run: mkdir -p otel-export && chmod 777 otel-export
      - name: Validar compose
        run: docker compose config
      - uses: docker/setup-buildx-action@v3
      - name: Imágenes de compose con caché de capas en GitHub Actions
        uses: docker/bake-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: compose.yaml
          targets: api,tasks,gateway,web
          load: true
          set: |
            api.tags=full-stack-template-api:latest
            tasks.tags=full-stack-template-tasks:latest
            gateway.tags=full-stack-template-gateway:latest
            web.tags=full-stack-template-web:latest
            api.cache-from=type=gha,scope=compose-api
            tasks.cache-from=type=gha,scope=compose-tasks
            gateway.cache-from=type=gha,scope=compose-gateway
            web.cache-from=type=gha,scope=compose-web
            ${{ github.ref == 'refs/heads/main' && 'api.cache-to=type=gha,scope=compose-api,mode=max' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'tasks.cache-to=type=gha,scope=compose-tasks,mode=max' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'gateway.cache-to=type=gha,scope=compose-gateway,mode=max' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'web.cache-to=type=gha,scope=compose-web,mode=max' || '' }}
      - name: Levantar stack y esperar cada healthcheck
        run: |
          if ! docker compose up --no-build --wait --wait-timeout 300; then
            docker compose ps
            docker compose logs gateway api tasks db rabbitmq otel prometheus
            exit 1
          fi
      - name: Smoke runtime (API, DB down, persistencia, OTEL)
        run: node .agents/skills/verify-template/scripts/smoke-api.mjs --compose
        env:
          API_BASE_URL: http://localhost:8080/api/v1/
      - name: Logs del stack si falla
        if: failure()
        run: docker compose logs gateway api tasks db rabbitmq otel prometheus
      - name: Apagar stack
        if: always()
        run: docker compose down --timeout 30 --volumes
      - name: Correlación log-traza y métricas no vacías en el export OTEL
        run: node .agents/skills/verify-template/scripts/check-otel-export.mjs otel-export
      - name: Publicar evidencia OTEL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-export
          path: otel-export/

  compose-slos:
    name: SLOs consultados y alertas disparadas en vivo con compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      RABBITMQ_PASSWORD: ci-rabbitmq-password
      OTEL_EXPORT_DIR: ${{ github.workspace }}/otel-export
      ACCOUNT_CLOSURE_GRACE_SECONDS: 20
      ACCOUNT_CLOSURE_FIRST_REMINDER_SECONDS: 5
      ACCOUNT_CLOSURE_SECOND_REMINDER_SECONDS: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bajar en segundo plano las imágenes que compose no construye
        run: nohup sh -c 'docker compose config --images | grep -v "^full-stack-template-" | xargs -P 4 -n 1 docker pull --quiet' > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Preparar export OTEL
        run: mkdir -p otel-export && chmod 777 otel-export
      - uses: docker/setup-buildx-action@v3
      - name: Imágenes de compose con caché de capas en GitHub Actions
        uses: docker/bake-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: compose.yaml
          targets: api,tasks,gateway
          load: true
          set: |
            api.tags=full-stack-template-api:latest
            tasks.tags=full-stack-template-tasks:latest
            gateway.tags=full-stack-template-gateway:latest
            api.cache-from=type=gha,scope=compose-api
            tasks.cache-from=type=gha,scope=compose-tasks
            gateway.cache-from=type=gha,scope=compose-gateway
      - name: Levantar el stack sin el frontend y esperar cada healthcheck
        run: |
          if ! docker compose up --no-build --wait --wait-timeout 300 db rabbitmq otel prometheus api tasks gateway; then
            docker compose ps
            docker compose logs gateway api tasks db rabbitmq otel prometheus
            exit 1
          fi
      - name: SLOs consultados en Prometheus y cada alerta disparada en vivo
        run: node .agents/skills/verify-template/scripts/check-slo-alerts.mjs slo-check
        env:
          API_BASE_URL: http://localhost:8080/api/v1/
          PROMETHEUS_URL: http://localhost:9090/
      - name: Logs del stack si falla
        if: failure()
        run: docker compose logs gateway api tasks db rabbitmq otel prometheus
      - name: Apagar stack
        if: always()
        run: docker compose down --timeout 30 --volumes
      - name: Correlación log-traza y métricas no vacías en el export OTEL
        run: node .agents/skills/verify-template/scripts/check-otel-export.mjs otel-export
      - name: Publicar evidencia de SLOs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-check
          path: slo-check/
          if-no-files-found: ignore
