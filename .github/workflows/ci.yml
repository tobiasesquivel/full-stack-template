name: Template CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend build, analyzers y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: template-ci
          POSTGRES_DB: template_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Backend build (analyzers como errores)
        run: dotnet build TemplateApp.slnx --configuration Release
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
          Jwt__Key: ci-jwt-key-at-least-32-characters-long!
      - name: Verificador de comentarios C#
        run: dotnet run --project dune/Dune.CommentVerifier -- --root .
      - name: Backend tests con PostgreSQL real
        run: dotnet test backend/Tests/TemplateApp.Tests.csproj --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
          Jwt__Key: ci-jwt-key-at-least-32-characters-long!
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=template_tests;Username=postgres;Password=template-ci;
      - name: Analyzer tests Dune
        run: dotnet test dune/Dune.Analyzers.Tests/Dune.Analyzers.Tests.csproj --configuration Release
      - name: Gate de estructura
        run: node dune/check-structure.mjs
      - name: Tests del gate de estructura
        run: node --test dune/check-structure.test.mjs

  frontend:
    name: Frontend build y gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Tests del gate de frontend
        run: node --test ../dune/check-frontend.test.mjs
      - name: Gate de frontend
        run: node ../dune/check-frontend.mjs --root ..

  comments:
    name: Comentarios del codigo propio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias de analisis
        run: npm ci --prefix frontend
      - name: Tests del gate de comentarios
        run: node --test dune/check-comments.test.mjs
      - name: Gate de comentarios
        run: node dune/check-comments.mjs --root .

  compose:
    name: Docker config y smoke runtime
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_KEY: ci-jwt-key-at-least-32-characters-long!
      OTEL_EXPORT_DIR: ${{ github.workspace }}/otel-export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Preparar export OTEL
        run: mkdir -p otel-export && chmod 777 otel-export
      - name: Validar compose
        run: docker compose config
      - name: Levantar stack
        run: docker compose up --build --detach
      - name: Esperar API lista
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null; then
              echo "API lista (intento $i)"
              exit 0
            fi
            sleep 5
          done
          echo "La API no alcanzó readiness tras 300s"
          docker compose ps
          docker compose logs api db otel
          exit 1
      - name: Smoke runtime (API, DB down, persistencia, OTEL)
        run: node .agents/skills/verify-template/scripts/smoke-api.mjs --compose
        env:
          API_BASE_URL: http://localhost:8080/api/v1/
      - name: Apagar stack
        if: always()
        run: docker compose down --volumes
      - name: Publicar evidencia OTEL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-export
          path: otel-export/
