<input
  type="checkbox"
  class="size-4.5 flex-none accent-blue-700 focus-visible:outline-blue-700"
  [id]="'done-' + task().id"
  [checked]="task().isCompleted"
  [disabled]="pending()"
  (change)="completedChange.emit(!task().isCompleted)"
  [attr.aria-label]="(task().isCompleted ? 'Marcar pendiente: ' : 'Marcar hecha: ') + task().title"
/>
@if (editing()) {
  <input
    type="text"
    class="w-full max-w-sm rounded-lg border border-slate-400 bg-white px-3 py-2 focus:border-blue-600 focus-visible:outline-blue-700"
    [id]="'edit-' + task().id"
    [formField]="editForm.title"
    aria-label="Editar título"
  />
  <button
    type="button"
    class="cursor-pointer rounded-lg border border-blue-700 bg-white px-4 py-2 text-blue-700 hover:enabled:border-blue-800 hover:enabled:bg-blue-50 hover:enabled:text-blue-800 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-xs:flex-auto"
    [disabled]="pending()"
    (click)="save()"
  >
    Guardar
  </button>
  <button
    type="button"
    class="cursor-pointer rounded-lg border border-blue-700 bg-white px-4 py-2 text-blue-700 hover:enabled:border-blue-800 hover:enabled:bg-blue-50 hover:enabled:text-blue-800 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-xs:flex-auto"
    (click)="editCancelled.emit()"
  >
    Cancelar
  </button>
} @else {
  <span class="flex-[1_1_12rem] wrap-anywhere" [class.line-through]="task().isCompleted">{{ task().title }}</span>
  <button
    type="button"
    class="cursor-pointer rounded-lg border border-blue-700 bg-white px-4 py-2 text-blue-700 hover:enabled:border-blue-800 hover:enabled:bg-blue-50 hover:enabled:text-blue-800 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-xs:flex-auto"
    [disabled]="pending()"
    (click)="editStarted.emit()"
  >
    Editar
  </button>
  <button
    type="button"
    #deleteButton
    class="cursor-pointer rounded-lg border border-blue-700 bg-white px-4 py-2 text-blue-700 hover:enabled:border-blue-800 hover:enabled:bg-blue-50 hover:enabled:text-blue-800 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60 max-xs:flex-auto"
    [disabled]="pending()"
    (click)="removeRequested.emit(deleteButton)"
  >
    Eliminar
  </button>
}
