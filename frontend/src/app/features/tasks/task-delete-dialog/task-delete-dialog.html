<dialog
  #dialog
  aria-labelledby="delete-confirm-title"
  aria-describedby="delete-confirm-body"
  aria-modal="true"
  class="w-[min(24rem,calc(100vw-2rem))] max-w-[calc(100vw-2rem)] rounded-xl border border-slate-200 bg-white p-5 text-slate-900 backdrop:bg-slate-900/40"
  (cancel)="cancel($event)"
>
  <h2 id="delete-confirm-title" class="mb-2 text-lg leading-tight">Confirmar eliminación</h2>
  <p id="delete-confirm-body" class="mb-4 wrap-anywhere">
    ¿Eliminar «{{ task()?.title }}»? Esta acción no se puede deshacer.
  </p>
  <div class="flex flex-wrap justify-end gap-2">
    <button
      type="button"
      class="cursor-pointer rounded-lg border border-blue-700 bg-white px-4 py-2 text-blue-700 hover:enabled:border-blue-800 hover:enabled:bg-blue-50 hover:enabled:text-blue-800 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      autofocus
      (click)="cancel()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="cursor-pointer rounded-lg border border-blue-700 bg-white px-4 py-2 text-blue-700 hover:enabled:border-blue-800 hover:enabled:bg-blue-50 hover:enabled:text-blue-800 focus-visible:outline-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      (click)="confirm()"
    >
      Confirmar
    </button>
  </div>
</dialog>
