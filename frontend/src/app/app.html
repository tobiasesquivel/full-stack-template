<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header>
  <nav aria-label="Principal">
    <a routerLink="/tasks" class="brand">Tareas</a>
    @if (auth.initialized()) {
      @if (auth.isAuthenticated()) {
        <a routerLink="/tasks">Mis tareas</a>
        <a routerLink="/profile">Mi perfil</a>
        <span role="status">{{ auth.currentUser()?.displayName }}</span>
        <button type="button" [disabled]="loggingOut()" (click)="logout()">
          {{ loggingOut() ? 'Saliendo…' : 'Salir' }}
        </button>
      } @else {
        <a routerLink="/login">Entrar</a>
        <a routerLink="/register">Crear cuenta</a>
      }
    }
  </nav>
  @if (logoutError()) {
    <p role="alert">{{ logoutError() }}</p>
  }
</header>
<main id="contenido">
  @if (!auth.initialized()) {
    <p role="status">Cargando…</p>
  } @else {
    <router-outlet />
  }
</main>
