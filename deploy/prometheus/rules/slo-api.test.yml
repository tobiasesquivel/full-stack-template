rule_files:
  - slo-api.rules.yml

evaluation_interval: 1m

tests:
  - name: trafico sano no dispara ninguna alerta
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+60x180'
      - series: 'http_server_request_duration_seconds_bucket{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200", le="0.5"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 180m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 180m
        alertname: ApiLatencyBudgetBurn
        exp_alerts: []
    promql_expr_test:
      - expr: job:slo_api_availability_errors:ratio_rate1h
        eval_time: 180m
        exp_samples:
          - labels: 'job:slo_api_availability_errors:ratio_rate1h{job="templateapp-api"}'
            value: 0
      - expr: job:slo_api_latency_errors:ratio_rate1h
        eval_time: 180m
        exp_samples:
          - labels: 'job:slo_api_latency_errors:ratio_rate1h{job="templateapp-api"}'
            value: 0

  - name: una caida total dispara la pagina y el ticket de disponibilidad, no los de latencia
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+60x60 3600x30'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500"}'
        values: '0x60 0+60x30'
      - series: 'http_server_request_duration_seconds_bucket{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200", le="0.5"}'
        values: '0+60x60 3600x30'
      - series: 'http_server_request_duration_seconds_bucket{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500", le="0.5"}'
        values: '0x60 0+60x30'
    alert_rule_test:
      - eval_time: 70m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              job: templateapp-api
              severity: page
            exp_annotations:
              summary: La API responde 5xx tan seguido que gasta el presupuesto de disponibilidad de 30 días en horas
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md
          - exp_labels:
              job: templateapp-api
              severity: ticket
            exp_annotations:
              summary: La API responde 5xx más seguido de lo que permite el presupuesto de disponibilidad de 30 días
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md
      - eval_time: 70m
        alertname: ApiLatencyBudgetBurn
        exp_alerts: []

  - name: un pico corto no despierta a nadie
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+60x120 7230+60x60'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500"}'
        values: '0x120 30x60'
    alert_rule_test:
      - eval_time: 123m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 180m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts: []
    promql_expr_test:
      - expr: job:slo_api_availability_errors:ratio_rate5m > bool (14.4 * 0.005)
        eval_time: 123m
        exp_samples:
          - labels: '{job="templateapp-api"}'
            value: 1
      - expr: job:slo_api_availability_errors:ratio_rate1h > bool (14.4 * 0.005)
        eval_time: 123m
        exp_samples:
          - labels: '{job="templateapp-api"}'
            value: 0

  - name: una quema lenta abre un ticket y no pagina
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+98x1500'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500"}'
        values: '0+2x1500'
    alert_rule_test:
      - eval_time: 1440m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              job: templateapp-api
              severity: ticket
            exp_annotations:
              summary: La API responde 5xx más seguido de lo que permite el presupuesto de disponibilidad de 30 días
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md

  - name: los 503 de readiness no cuentan contra el SLO
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+60x90'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/health/ready", http_response_status_code="503"}'
        values: '0+60x90'
      - series: 'http_server_request_duration_seconds_bucket{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200", le="0.5"}'
        values: '0+60x90'
      - series: 'http_server_request_duration_seconds_bucket{job="templateapp-api", http_route="/api/v{version:apiVersion}/health/ready", http_response_status_code="503", le="0.5"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 90m
        alertname: ApiLatencyBudgetBurn
        exp_alerts: []

  - name: los 4xx y los 429 son respuestas correctas del servicio
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+30x90'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="429"}'
        values: '0+20x90'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/{id:guid}", http_response_status_code="404"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts: []

  - name: requests lentos disparan la pagina y el ticket de latencia
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+60x90'
      - series: 'http_server_request_duration_seconds_bucket{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200", le="0.5"}'
        values: '0+60x60 3600x30'
    alert_rule_test:
      - eval_time: 75m
        alertname: ApiLatencyBudgetBurn
        exp_alerts:
          - exp_labels:
              job: templateapp-api
              severity: page
            exp_annotations:
              summary: Tantos requests tardan más de 500 ms que la API gasta el presupuesto de latencia de 30 días en horas
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiLatencyBudgetBurn.md
          - exp_labels:
              job: templateapp-api
              severity: ticket
            exp_annotations:
              summary: Más requests de los que permite el presupuesto de latencia de 30 días tardan más de 500 ms
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiLatencyBudgetBurn.md
      - eval_time: 75m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts: []

  - name: una instancia nueva que solo responde 5xx dispara la pagina de disponibilidad
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", instance="vieja", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+60x60'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", instance="nueva", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500"}'
        values: '_x60 0+60x60'
    alert_rule_test:
      - eval_time: 115m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              job: templateapp-api
              severity: page
            exp_annotations:
              summary: La API responde 5xx tan seguido que gasta el presupuesto de disponibilidad de 30 días en horas
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md
          - exp_labels:
              job: templateapp-api
              severity: ticket
            exp_annotations:
              summary: La API responde 5xx más seguido de lo que permite el presupuesto de disponibilidad de 30 días
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md

  - name: una quema media de seis horas pagina por la ventana de 6h y no por la de 1h
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+96x400'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500"}'
        values: '0+4x400'
    alert_rule_test:
      - eval_time: 390m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              job: templateapp-api
              severity: page
            exp_annotations:
              summary: La API responde 5xx tan seguido que gasta el presupuesto de disponibilidad de 30 días en horas
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md
          - exp_labels:
              job: templateapp-api
              severity: ticket
            exp_annotations:
              summary: La API responde 5xx más seguido de lo que permite el presupuesto de disponibilidad de 30 días
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md
    promql_expr_test:
      - expr: job:slo_api_availability_errors:ratio_rate1h > bool (14.4 * 0.005)
        eval_time: 390m
        exp_samples:
          - labels: '{job="templateapp-api"}'
            value: 0

  - name: una quema lenta de tres dias abre ticket por la ventana de 3d y no por la de 1d
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="200"}'
        values: '0+124x400'
      - series: 'http_server_request_duration_seconds_count{job="templateapp-api", http_route="/api/v{version:apiVersion}/tasks/", http_response_status_code="500"}'
        values: '0+1x400'
    alert_rule_test:
      - eval_time: 390m
        alertname: ApiAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              job: templateapp-api
              severity: ticket
            exp_annotations:
              summary: La API responde 5xx más seguido de lo que permite el presupuesto de disponibilidad de 30 días
              runbook_url: https://github.com/tobiasesquivel/full-stack-template/blob/main/docs/operacion/runbooks/ApiAvailabilityBudgetBurn.md
    promql_expr_test:
      - expr: job:slo_api_availability_errors:ratio_rate1d > bool (3 * 0.005)
        eval_time: 390m
        exp_samples:
          - labels: '{job="templateapp-api"}'
            value: 0
