schema: spec-driven

context: |
  TemplateApp is a full-stack Git template monorepo.
  Backend: ASP.NET Core 10, EF Core + Npgsql PostgreSQL, Identity, ErrorOr, FluentValidation.
  Features: Auth, Users, Tasks, Health with direct modules and minimal endpoints.
  Frontend: Angular 22, same-origin /api/v1, in-memory access token and HttpOnly refresh cookie.
  Operations: PostgreSQL 18, Docker Compose, Serilog OTLP logs, OpenTelemetry metrics and traces.
  Architecture: docs/adr/0003-full-stack-template-dune.md and docs/architecture.md.
  Active contracts exist only in openspec/specs. changes/archive is historical evidence.
  Backend compilation and runtime are NOT VERIFIED in the documentation delivery; the integrator reports SDK 10.0.401 available for subsequent verification.

rules:
  proposal:
    - Describe the observable change, affected contracts, and migration risks.
    - Preserve data and archived evidence. Do not introduce compatibility shims.
  specs:
    - Use RFC 2119 requirements and Given/When/Then scenarios.
    - Describe behavior across HTTP and persistence, not incidental source strings.
  design:
    - Follow docs/architecture.md and docs/conventions.md.
    - Keep endpoints thin and feature implementations local. No mediator or generic repository.
  tasks:
    - Deliver backend, frontend, tests, and spec atomically for a contract change.
    - Do not impose a line-count budget on a PR.
  apply:
    - Keep feature tests physically colocated and excluded from production compilation.
    - Delegates do not run checks mid-flight. The integrator verifies after all slices land.
  verify:
    - Report only executed checks and observed results. Separate intended gates from evidence.
    - Exercise real PostgreSQL, browser behavior, and exported telemetry.
  archive:
    - Preserve prior contracts and state which active requirements supersede them.
